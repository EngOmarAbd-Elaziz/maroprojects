<!DOCTYPE html>

<html lang="en">

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex, follow">
	<title>Registration</title>
	<link rel="shortcut icon" href="images/output-onlinepngtools3.png" type="image/x-icon">
	<script src="https://kit.fontawesome.com/your-code.js" crossorigin="anonymous"></script>
	<link rel="stylesheet" href="reg.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>
	<div class="limiter">
		<div class="container-login">
			<div class="wrap-login">
				<form class="login-form fancy-form">
					<h2 class="form-title">Login</h2>

					<div class="form-group">
						<input type="text" name="username" required>
						<label>Username or Email</label>
					</div>

					<div class="form-group password-container">
						<input type="password" id="password" name="password" required>
						<label>Password</label>
						<div class="toggle-eye" onclick="togglePassword()">

							<svg id="eyeOpen" class="active" xmlns="http://www.w3.org/2000/svg" fill="#fff"
								viewBox="0 0 24 24">
								<path
									d="M12 5c-7 0-11 7-11 7s4 7 11 7 11-7 11-7-4-7-11-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10z" />
								<circle cx="12" cy="12" r="2.5" />
							</svg>

							<svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" fill="#fff" viewBox="0 0 24 24">
								<path
									d="M1 1l22 22-1.41 1.41L18.17 19c-1.63.67-3.47 1-5.17 1-7 0-11-7-11-7 1.37-2.59 3.57-4.73 6.22-5.84L2.39 2.39 1 1zm10.17 10.17l-2.34-2.34A3.5 3.5 0 0 0 8.5 12c0 .89.34 1.7.89 2.31l1.28-1.28zM12 6a6 6 0 0 1 6 6c0 .96-.24 1.85-.66 2.64l1.46 1.46C20.14 14.06 21.4 13 22 12c-1.73-4.39-6-7.5-11-7.5-1.24 0-2.43.22-3.53.63l1.44 1.44C9.95 6.22 10.95 6 12 6z" />
							</svg>
						</div>
					</div>

					<div class="forgot-password">
						<a href="#">Forgot password?</a>
					</div>

					<div class="container-btn">
						<div class="wrap-btn">
							<div class="bgbtn"></div>
							<button class="btn">Login</button>
						</div>
					</div>

					<div class="signup-text">
						Or Sign Up Using
					</div>

					<div class="social-icons">
						<a href="#" class="social-item facebook"><i class="fab fa-facebook-f"></i></a>
						<a href="#" class="social-item twitter"><i class="fab fa-twitter"></i></a>
						<a href="#" class="social-item google"><i class="fab fa-google"></i></a>
					</div>
				</form>

			</div>
		</div>
	</div>
	<link rel="stylesheet" href="reg.css">
	<script src="reg.js"></script>
</body>

</html>
