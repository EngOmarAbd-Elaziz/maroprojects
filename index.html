<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X/O Game</title>
    <link rel="stylesheet" href="main-light.css" id="theme-style">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <button id="mode-toggle">🌙<span class="label">Boys-mode</span>
    </button>

    <div class="game">

        <div class="name">
            <span class="title"> X O </span> Game
        </div>

        <div class="wins" id="win">
            <span id="x">X wins: 0</span>
            <span id="o">O wins: 0</span>
        </div>

        <div class="turns" id="turn">
            X turn
        </div>

        <div class="board">
            <div class="squares" id="square1"></div>
            <div class="squares" id="square2"></div>
            <div class="squares" id="square3"></div>

            <div class="squares" id="square4"></div>
            <div class="squares" id="square5"></div>
            <div class="squares" id="square6"></div>

            <div class="squares" id="square7"></div>
            <div class="squares" id="square8"></div>
            <div class="squares" id="square9"></div>
        </div>


        <div class="button-group">
            <button type="button" id="restart">
                <i class="fa fa-refresh fa-spin"></i> Restart Game
            </button>

            <button type="button" id="reset-score">ReScore</button>
        </div>
    </div>
    <script src="system.js"></script>
</body>

</html>
